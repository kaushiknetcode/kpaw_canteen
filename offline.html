<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be Right Back!</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #ffffff; /* This makes the background pure white */
            display: flex;
            justify-content: center; /* This centers the GIF in the middle of the screen */
        }

        .perfect-gif {
            height: 100vh; /* This forces the GIF to touch the top and bottom */
            max-width: 100%;
            object-fit: contain; /* This stops the GIF from stretching or cropping */
        }
    </style>
</head>
<body>

    <img src="/pause.gif" alt="Maintenance" class="perfect-gif">

</body>
</html>
